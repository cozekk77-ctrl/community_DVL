<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVLZ Community</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: #0a0a0a;
            border-bottom: 3px solid #cc0000;
            padding: 25px 0;
            margin-bottom: 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #cc0000;
            letter-spacing: 4px;
            font-family: monospace;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        button {
            background: #cc0000;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: monospace;
        }

        button:hover {
            background: #ff0000;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #666666;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #cc0000;
        }

        .btn-secondary:hover {
            background: #cc0000;
        }

        .main-section {
            display: none;
        }

        .main-section.active {
            display: block;
        }

        .welcome-section {
            text-align: center;
            padding: 100px 20px;
        }

        .welcome-section h1 {
            font-size: 64px;
            margin-bottom: 20px;
            color: #cc0000;
            font-weight: 700;
            letter-spacing: 8px;
        }

        .welcome-section p {
            font-size: 18px;
            color: #999999;
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 80px;
        }

        .stat-card {
            background: #0a0a0a;
            border: 2px solid #cc0000;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.5);
        }

        .stat-number {
            font-size: 56px;
            font-weight: 700;
            color: #cc0000;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 14px;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #0a0a0a;
            padding: 50px;
            border: 3px solid #cc0000;
        }

        .form-container h2 {
            color: #cc0000;
            margin-bottom: 40px;
            font-size: 32px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            background: #000000;
            border: 2px solid #333333;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #cc0000;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .form-actions button {
            flex: 1;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .member-card {
            background: #0a0a0a;
            border: 2px solid #333333;
            padding: 30px;
            transition: all 0.3s ease;
        }

        .member-card:hover {
            border-color: #cc0000;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(204, 0, 0, 0.4);
        }

        .member-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 2px solid #1a1a1a;
        }

        .member-avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #cc0000 0%, #660000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: #ffffff;
        }

        .member-info h3 {
            font-size: 22px;
            color: #cc0000;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .member-role {
            color: #666666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .member-details {
            margin-bottom: 25px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .detail-label {
            color: #666666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-value {
            color: #ffffff;
            font-weight: 700;
        }

        .member-bio {
            color: #999999;
            font-size: 14px;
            line-height: 1.8;
        }

        .profile-section {
            max-width: 900px;
            margin: 0 auto;
        }

        .profile-header {
            background: #0a0a0a;
            border: 3px solid #cc0000;
            padding: 50px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .profile-avatar {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #cc0000 0%, #660000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            font-weight: 700;
            color: #ffffff;
        }

        .profile-info h2 {
            font-size: 36px;
            color: #cc0000;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .profile-meta {
            color: #666666;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .profile-content {
            background: #0a0a0a;
            border: 2px solid #333333;
            padding: 50px;
        }

        .alert {
            padding: 20px;
            margin-bottom: 30px;
            border-left: 5px solid #cc0000;
            background: #1a0000;
            color: #ffffff;
            font-size: 14px;
        }

        .alert.success {
            border-left-color: #00cc00;
            background: #001a00;
        }

        .search-bar {
            margin-bottom: 40px;
        }

        .search-bar input {
            width: 100%;
            padding: 18px;
            font-size: 16px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666666;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(3, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: #666666;
        }

        .empty-state h3 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #999999;
            letter-spacing: 2px;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00cc00;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }

            .welcome-section h1 {
                font-size: 36px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .members-grid {
                grid-template-columns: 1fr;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <span class="status-indicator"></span>DVLZ COMMUNITY
            </div>
            <nav class="nav-buttons">
                <button onclick="showSection('home')">HOME</button>
                <button onclick="showSection('members')">MEMBERS</button>
                <button onclick="showSection('profile')" id="profileBtn" style="display: none;">PROFILE</button>
                <button onclick="showSection('join')" id="joinBtn">JOIN</button>
                <button onclick="logout()" id="logoutBtn" style="display: none;" class="btn-secondary">LOGOUT</button>
            </nav>
        </div>
    </header>

    <div class="container">
        <div id="homeSection" class="main-section active">
            <div class="welcome-section">
                <h1>DVLZ</h1>
                <p>ELITE DEVELOPER COMMUNITY MALAYSIA</p>
                <button onclick="showSection('join')" style="padding: 18px 50px; font-size: 16px;">JOIN NOW</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalMembers">0</div>
                    <div class="stat-label">TOTAL MEMBERS</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="activeDevelopers">0</div>
                    <div class="stat-label">ACTIVE DEVS</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalProjects">0</div>
                    <div class="stat-label">PROJECTS</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="yearsActive">1</div>
                    <div class="stat-label">YEARS</div>
                </div>
            </div>
        </div>

        <div id="joinSection" class="main-section">
            <div class="form-container">
                <h2>JOIN</h2>
                <div id="joinAlert"></div>
                <form id="joinForm" onsubmit="handleJoin(event)">
                    <div class="form-group">
                        <label>NAMA PENUH</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label>EMAIL</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>USERNAME</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label>KEAHLIAN</label>
                        <select id="expertise" required>
                            <option value="">PILIH KEAHLIAN</option>
                            <option value="Frontend Developer">FRONTEND DEVELOPER</option>
                            <option value="Backend Developer">BACKEND DEVELOPER</option>
                            <option value="Full Stack Developer">FULL STACK DEVELOPER</option>
                            <option value="Mobile Developer">MOBILE DEVELOPER</option>
                            <option value="DevOps Engineer">DEVOPS ENGINEER</option>
                            <option value="UI/UX Designer">UI/UX DESIGNER</option>
                            <option value="Data Scientist">DATA SCIENTIST</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>PENGALAMAN (TAHUN)</label>
                        <input type="number" id="experience" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>BIO</label>
                        <textarea id="bio" required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="joinSubmitBtn">JOIN</button>
                        <button type="button" class="btn-secondary" onclick="showSection('home')">CANCEL</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="membersSection" class="main-section">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="CARI AHLI..." onkeyup="searchMembers()">
            </div>
            <div id="loadingMembers" class="loading">LOADING MEMBERS</div>
            <div id="membersGrid" class="members-grid" style="display: none;"></div>
            <div id="emptyMembers" class="empty-state" style="display: none;">
                <h3>TIADA AHLI</h3>
                <p>Jadilah yang pertama untuk join</p>
            </div>
        </div>

        <div id="profileSection" class="main-section">
            <div class="profile-section">
                <div class="profile-header">
                    <div class="profile-avatar" id="profileAvatar"></div>
                    <div class="profile-info">
                        <h2 id="profileName"></h2>
                        <div class="profile-meta" id="profileMeta"></div>
                    </div>
                </div>
                <div class="profile-content">
                    <div id="profileAlert"></div>
                    <form id="profileForm" onsubmit="updateProfile(event)">
                        <div class="form-group">
                            <label>NAMA PENUH</label>
                            <input type="text" id="editFullName" required>
                        </div>
                        <div class="form-group">
                            <label>EMAIL</label>
                            <input type="email" id="editEmail" required>
                        </div>
                        <div class="form-group">
                            <label>KEAHLIAN</label>
                            <select id="editExpertise" required>
                                <option value="Frontend Developer">FRONTEND DEVELOPER</option>
                                <option value="Backend Developer">BACKEND DEVELOPER</option>
                                <option value="Full Stack Developer">FULL STACK DEVELOPER</option>
                                <option value="Mobile Developer">MOBILE DEVELOPER</option>
                                <option value="DevOps Engineer">DEVOPS ENGINEER</option>
                                <option value="UI/UX Designer">UI/UX DESIGNER</option>
                                <option value="Data Scientist">DATA SCIENTIST</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>PENGALAMAN (TAHUN)</label>
                            <input type="number" id="editExperience" min="0" required>
                        </div>
                        <div class="form-group">
                            <label>BIO</label>
                            <textarea id="editBio" required></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" id="profileSubmitBtn">UPDATE</button>
                            <button type="button" class="btn-secondary" onclick="showSection('home')">CANCEL</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        let members = [];
        let currentUser = null;
        let allMembersData = [];

        async function init() {
            const storedUser = await getStorageData('dvlz_current_user');
            if (storedUser) {
                currentUser = storedUser;
                updateUIForLoggedInUser();
            }
            
            await loadMembers();
            updateStats();
        }

        async function getStorageData(key) {
            try {
                const result = await window.storage.get(key);
                return result ? JSON.parse(result.value) : null;
            } catch (error) {
                return null;
            }
        }

        async function setStorageData(key, value) {
            try {
                await window.storage.set(key, JSON.stringify(value), true);
                return true;
            } catch (error) {
                console.error('Storage error:', error);
                return false;
            }
        }

        async function loadMembers() {
            try {
                const keys = await window.storage.list('dvlz_member_');
                if (!keys || !keys.keys || keys.keys.length === 0) {
                    allMembersData = [];
                    members = [];
                    return;
                }

                const memberPromises = keys.keys.map(async (key) => {
                    try {
                        const result = await window.storage.get(key, true);
                        return result ? JSON.parse(result.value) : null;
                    } catch (error) {
                        return null;
                    }
                });

                const loadedMembers = await Promise.all(memberPromises);
                allMembersData = loadedMembers.filter(m => m !== null);
                members = [...allMembersData];
            } catch (error) {
                console.error('Error loading members:', error);
                allMembersData = [];
                members = [];
            }
        }

        function updateUIForLoggedInUser() {
            document.getElementById('joinBtn').style.display = 'none';
            document.getElementById('profileBtn').style.display = 'inline-block';
            document.getElementById('logoutBtn').style.display = 'inline-block';
        }

        function updateUIForLoggedOutUser() {
            document.getElementById('joinBtn').style.display = 'inline-block';
            document.getElementById('profileBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
        }

        async function showSection(section) {
            const sections = document.querySelectorAll('.main-section');
            sections.forEach(s => s.classList.remove('active'));
            
            document.getElementById(section + 'Section').classList.add('active');
            
            if (section === 'profile' && currentUser) {
                loadProfileData();
            }
            
            if (section === 'members') {
                document.getElementById('loadingMembers').style.display = 'block';
                document.getElementById('membersGrid').style.display = 'none';
                document.getElementById('emptyMembers').style.display = 'none';
                
                await loadMembers();
                renderMembers();
                
                document.getElementById('loadingMembers').style.display = 'none';
            }
        }

        async function handleJoin(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('joinSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'PROCESSING...';
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const expertise = document.getElementById('expertise').value;
            const experience = parseInt(document.getElementById('experience').value);
            const bio = document.getElementById('bio').value.trim();
            
            await loadMembers();
            
            const usernameExists = allMembersData.some(m => m.username.toLowerCase() === username.toLowerCase());
            if (usernameExists) {
                showAlert('joinAlert', 'USERNAME SUDAH DIGUNAKAN', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'JOIN';
                return;
            }
            
            const emailExists = allMembersData.some(m => m.email.toLowerCase() === email.toLowerCase());
            if (emailExists) {
                showAlert('joinAlert', 'EMAIL SUDAH DIDAFTARKAN', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'JOIN';
                return;
            }
            
            const member = {
                id: Date.now(),
                fullName,
                email,
                username,
                expertise,
                experience,
                bio,
                joinedDate: new Date().toLocaleDateString('ms-MY')
            };
            
            const saved = await setStorageData(`dvlz_member_${member.id}`, member);
            
            if (saved) {
                currentUser = member;
                await setStorageData('dvlz_current_user', currentUser);
                
                await loadMembers();
                updateStats();
                updateUIForLoggedInUser();
                
                document.getElementById('joinForm').reset();
                showAlert('joinAlert', 'BERJAYA JOIN DVLZ COMMUNITY', 'success');
                
                setTimeout(() => {
                    showSection('home');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'JOIN';
                }, 1500);
            } else {
                showAlert('joinAlert', 'ERROR MENYIMPAN DATA', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'JOIN';
            }
        }

        async function updateProfile(event) {
            event.preventDefault();
            
            if (!currentUser) return;
            
            const submitBtn = document.getElementById('profileSubmitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'UPDATING...';
            
            const fullName = document.getElementById('editFullName').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const expertise = document.getElementById('editExpertise').value;
            const experience = parseInt(document.getElementById('editExperience').value);
            const bio = document.getElementById('editBio').value.trim();
            
            await loadMembers();
            
            const emailExists = allMembersData.some(m => m.id !== currentUser.id && m.email.toLowerCase() === email.toLowerCase());
            if (emailExists) {
                showAlert('profileAlert', 'EMAIL SUDAH DIGUNAKAN', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'UPDATE';
                return;
            }
            
            const updatedMember = {
                ...currentUser,
                fullName,
                email,
                expertise,
                experience,
                bio
            };
            
            const saved = await setStorageData(`dvlz_member_${currentUser.id}`, updatedMember);
            
            if (saved) {
                currentUser = updatedMember;
                await setStorageData('dvlz_current_user', currentUser);
                
                await loadMembers();
                updateStats();
                
                showAlert('profileAlert', 'PROFILE DIKEMASKINI', 'success');
                
                setTimeout(() => {
                    document.getElementById('profileAlert').innerHTML = '';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'UPDATE';
                }, 2000);
            } else {
                showAlert('profileAlert', 'ERROR UPDATE PROFILE', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'UPDATE';
            }
        }

        function loadProfileData() {
            if (!currentUser) return;
            
            document.getElementById('profileAvatar').textContent = currentUser.fullName.charAt(0).toUpperCase();
            document.getElementById('profileName').textContent = currentUser.fullName;
            document.getElementById('profileMeta').textContent = `@${currentUser.username} | ${currentUser.expertise}`;
            
            document.getElementById('editFullName').value = currentUser.fullName;
            document.getElementById('editEmail').value = currentUser.email;
            document.getElementById('editExpertise').value = currentUser.expertise;
            document.getElementById('editExperience').value = currentUser.experience;
            document.getElementById('editBio').value = currentUser.bio;
        }

        function renderMembers() {
            const grid = document.getElementById('membersGrid');
            const empty = document.getElementById('emptyMembers');
            
            if (members.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            
            grid.style.display = 'grid';
            empty.style.display = 'none';
            
            grid.innerHTML = members.map(member => `
                <div class="member-card">
                    <div class="member-header">
                        <div class="member-avatar">${member.fullName.charAt(0).toUpperCase()}</div>
                        <div class="member-info">
                            <h3>${member.fullName}</h3>
                            <div class="member-role">${member.expertise}</div>
                        </div>
                    </div>
                    <div class="member-details">
                        <div class="detail-row">
                            <span class="detail-label">USERNAME</span>
                            <span class="detail-value">@${member.username}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">EXPERIENCE</span>
                            <span class="detail-value">${member.experience} TAHUN</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">JOINED</span>
                            <span class="detail-value">${member.joinedDate}</span>
                        </div>
                    </div>
                    <div class="member-bio">${member.bio}</div>
                </div>
            `).join('');
        }

        function searchMembers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (searchTerm === '') {
                members = [...allMembersData];
                renderMembers();
                return;
            }
            
            members = allMembersData.filter(m => 
                m.fullName.toLowerCase().includes(searchTerm) ||
                m.username.toLowerCase().includes(searchTerm) ||
                m.expertise.toLowerCase().includes(searchTerm)
            );
            
            renderMembers();
        }

        function updateStats() {
            document.getElementById('totalMembers').textContent = allMembersData.length;
            document.getElementById('activeDevelopers').textContent = allMembersData.filter(m => m.experience > 0).length;
            document.getElementById('totalProjects').textContent = allMembersData.reduce((sum, m) => sum + m.experience, 0);
        }

        async function logout() {
            currentUser = null;
            try {
                await window.storage.delete('dvlz_current_user');
            } catch (error) {
                console.error('Logout error:', error);
            }
            updateUIForLoggedOutUser();
            showSection('home');
        }

        function showAlert(elementId, message, type) {
            const alertDiv = document.getElementById(elementId);
            alertDiv.innerHTML = `<div class="alert ${type === 'success' ? 'success' : ''}">${message}</div>`;
            
            setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 5000);
        }

        init();
    </script>
</body>
</html>
